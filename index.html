<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BFC Attendance</title>
<script>(function(){try{var l=localStorage.getItem('bfc-theme')==='light';document.documentElement.dataset.theme=l?'light':'dark';}catch(e){}})();</script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1410">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BFC">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1410;
    --surface:#131F19;
    --surface-2:#1A2820;
    --border:#243529;
    --text:#F5F3EA;
    --text-muted:#87998C;
    --gold:#D4A64A;
    --gold-soft:rgba(212,166,74,0.14);
    --present:#4CAF6D;
    --present-dim:rgba(76,175,109,0.14);
    --absent:#E0685C;
    --absent-dim:rgba(224,104,92,0.14);
    --radius:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .display{font-family:'Oswald',sans-serif; text-transform:uppercase;}
  ::selection{background:var(--gold-soft);}

  /* HEADER */
  .top-header{
    padding:calc(22px + env(safe-area-inset-top)) 20px 18px;
    position:relative;
    overflow:hidden;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, #101B15 0%, var(--bg) 100%);
  }
  .top-header .pitch-mark{
    position:absolute; top:-40px; right:-50px; opacity:0.08; pointer-events:none;
  }
  .brand-row{display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1;}
  .brand{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:30px;
    letter-spacing:1px;
    color:var(--gold);
    line-height:1;
  }
  .brand-sub{
    font-size:11px;
    letter-spacing:3px;
    color:var(--text-muted);
    text-transform:uppercase;
    margin-top:4px;
    font-weight:600;
  }
  .back-btn{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    width:38px; height:38px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
    cursor:pointer;
  }
  .back-btn:active{background:var(--border);}
  .header-title{position:relative; z-index:1;}
  .screen-title{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:24px;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .screen-sub{color:var(--text-muted); font-size:13px; margin-top:2px;}

  /* MAIN CONTENT */
  .content{flex:1; padding:16px 16px 100px; overflow-y:auto;}
  .content.no-nav{padding-bottom:24px;}

  /* CATEGORY CARDS */
  .cat-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 18px;
    margin-bottom:12px;
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease;
  }
  .cat-card:active{transform:scale(0.98); border-color:var(--gold-soft);}
  .cat-name{
    font-family:'Oswald',sans-serif;
    font-size:22px;
    font-weight:600;
    letter-spacing:0.5px;
  }
  .cat-meta{color:var(--text-muted); font-size:12.5px; margin-top:3px;}
  .cat-arrow{color:var(--gold); font-size:20px; opacity:0.8;}
  .ball-badge{
    width:44px; height:44px;
    border-radius:50%;
    background:var(--gold-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    margin-right:14px;
    flex-shrink:0;
  }
  .cat-row-left{display:flex; align-items:center;}

  .add-btn{
    width:100%;
    background:var(--surface);
    border:1.5px dashed var(--border);
    color:var(--text-muted);
    border-radius:var(--radius);
    padding:16px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    margin-top:4px;
  }
  .add-btn:active{border-color:var(--gold); color:var(--gold);}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--text-muted);
  }
  .empty-state .icon{font-size:40px; margin-bottom:10px;}
  .empty-state h3{color:var(--text); font-family:'Oswald',sans-serif; font-weight:600; font-size:20px; margin:0 0 6px;}
  .empty-state p{font-size:13.5px; line-height:1.5; margin:0 0 18px;}

  /* BOTTOM NAV */
  .bottom-nav{
    position:fixed;
    bottom:0; left:0; right:0;
    max-width:480px;
    margin:0 auto;
    background:rgba(19,31,25,0.92);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--border);
    display:flex;
    padding:10px 8px calc(10px + env(safe-area-inset-bottom));
    z-index:20;
  }
  .nav-item{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--text-muted);
    font-family:'Inter',sans-serif; font-size:11px; font-weight:600;
    cursor:pointer; padding:4px;
  }
  .nav-item.active{color:var(--gold);}
  .nav-item .nav-icon{font-size:19px;}

  /* SCOREBOARD */
  .scoreboard{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .score-main{font-family:'Oswald',sans-serif; font-size:38px; font-weight:700; letter-spacing:1px; color:var(--gold); line-height:1;}
  .score-label{color:var(--text-muted); font-size:11px; letter-spacing:2px; margin-top:4px; text-transform:uppercase;}
  .score-absent{
    text-align:right;
    color:var(--absent);
    font-family:'Oswald',sans-serif;
    font-size:20px;
    font-weight:600;
  }
  .score-absent small{display:block; color:var(--text-muted); font-family:'Inter',sans-serif; font-size:10.5px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; margin-top:3px;}

  .date-row{
    display:flex; align-items:center; gap:10px;
    margin-bottom:14px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:10px 14px;
  }
  .date-row input[type="date"]{
    background:none; border:none; color:var(--text);
    font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
    flex:1;
    -webkit-appearance:none;
  }
  .date-row input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.7); cursor:pointer;}

  /* TOGGLE (include absent) */
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    margin-bottom:14px;
  }
  .toggle-label{font-size:13.5px; font-weight:600; color:var(--text);}
  .toggle-hint{font-size:11.5px; color:var(--text-muted); margin-top:2px;}
  .toggle-switch{
    width:46px; height:26px;
    border-radius:20px;
    background:var(--surface-2);
    border:1px solid var(--border);
    position:relative;
    cursor:pointer;
    flex-shrink:0;
    transition:background .15s ease, border-color .15s ease;
  }
  .toggle-switch.on{background:var(--gold); border-color:var(--gold);}
  .toggle-knob{
    position:absolute; top:2px; left:2px;
    width:20px; height:20px;
    border-radius:50%;
    background:var(--text-muted);
    transition:transform .15s ease, background .15s ease;
  }
  .toggle-switch.on .toggle-knob{transform:translateX(20px); background:#1A1408;}

  .mark-all-btn{
    width:100%;
    background:var(--gold);
    color:#1A1408;
    border:none;
    border-radius:var(--radius-sm);
    padding:14px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
    margin-bottom:16px;
  }
  .mark-all-btn:active{opacity:0.85; transform:scale(0.99);}

  /* PLAYER ROWS */
  .player-row{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:10px;
  }
  .player-row.is-present{border-color:rgba(76,175,109,0.35);}
  .player-row.is-absent{border-color:rgba(224,104,92,0.35);}
  .player-name{font-weight:600; font-size:15.5px; margin-bottom:10px;}
  .status-btns{display:flex; gap:8px;}
  .status-btn{
    flex:1;
    padding:12px 6px;
    border-radius:var(--radius-sm);
    border:1.5px solid var(--border);
    background:var(--surface-2);
    color:var(--text-muted);
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    transition:all .1s ease;
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .status-btn:active{transform:scale(0.96);}
  .status-btn.present.active{background:var(--present-dim); border-color:var(--present); color:var(--present);}
  .status-btn.absent.active{background:var(--absent-dim); border-color:var(--absent); color:var(--absent);}

  .sticky-bottom{
    position:fixed; bottom:0; left:0; right:0;
    max-width:480px; margin:0 auto;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg, var(--bg) 60%, rgba(11,20,16,0));
    z-index:15;
  }
  .primary-btn{
    width:100%;
    background:var(--gold);
    color:#1A1408;
    border:none;
    border-radius:var(--radius);
    padding:16px;
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(212,166,74,0.18);
  }
  .primary-btn:active{transform:scale(0.98); opacity:0.9;}
  .secondary-btn{
    width:100%;
    background:var(--surface-2);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:15px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    margin-top:10px;
  }
  .secondary-btn:active{background:var(--border);}

  /* GENERATE / OUTPUT */
  .output-box{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    white-space:pre-wrap;
    font-family:'Inter',sans-serif;
    font-size:14px;
    line-height:1.7;
    margin-bottom:16px;
  }
  .copied-toast{
    position:fixed; top:calc(18px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    background:var(--gold); color:#1A1408;
    padding:10px 18px; border-radius:30px;
    font-weight:700; font-size:13px;
    z-index:100;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
    animation:toastIn .18s ease;
  }
  @keyframes toastIn{from{opacity:0; transform:translate(-50%,-8px);} to{opacity:1; transform:translate(-50%,0);}}

  /* HISTORY */
  .history-group-title{
    font-family:'Oswald',sans-serif;
    font-size:13px; letter-spacing:2px;
    color:var(--text-muted);
    text-transform:uppercase;
    margin:18px 0 10px;
  }
  .history-group-title:first-child{margin-top:0;}
  .session-row{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:14px 16px;
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
    cursor:pointer;
  }
  .session-row:active{background:var(--surface-2);}
  .session-date{font-weight:600; font-size:14.5px;}
  .session-badge{
    font-family:'Oswald',sans-serif;
    font-weight:600; font-size:13px;
    padding:4px 10px;
    border-radius:20px;
  }
  .badge-full{background:var(--present-dim); color:var(--present);}
  .badge-partial{background:var(--gold-soft); color:var(--gold);}
  .badge-low{background:var(--absent-dim); color:var(--absent);}

  .detail-list-title{font-size:11.5px; letter-spacing:2px; color:var(--text-muted); text-transform:uppercase; font-weight:700; margin:16px 0 8px;}
  .detail-player{
    padding:11px 14px; border-radius:var(--radius-sm);
    background:var(--surface); border:1px solid var(--border);
    margin-bottom:7px; font-size:14.5px; font-weight:500;
    display:flex; align-items:center; gap:8px;
  }

  /* MANAGE */
  .manage-player-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:13px 14px; margin-bottom:8px;
  }
  .icon-btn{
    background:none; border:none; color:var(--text-muted); font-size:16px; cursor:pointer; padding:4px 8px;
  }
  .icon-btn.danger:active{color:var(--absent);}
  .icon-btn:active{color:var(--gold);}

  /* MODAL */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:200;
  }
  .modal-sheet{
    background:var(--surface); border:1px solid var(--border);
    border-radius:20px 20px 0 0;
    width:100%; max-width:480px;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    animation:sheetUp .18s ease;
  }
  @keyframes sheetUp{from{transform:translateY(20px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-title{font-family:'Oswald',sans-serif; font-weight:600; font-size:19px; margin-bottom:14px; text-transform:uppercase; letter-spacing:0.5px;}
  .modal-input{
    width:100%; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); border-radius:var(--radius-sm); padding:13px 14px;
    font-family:'Inter',sans-serif; font-size:16px; margin-bottom:14px;
  }
  .modal-input:focus{outline:none; border-color:var(--gold);}
  .modal-btns{display:flex; gap:10px;}
  .modal-btns .primary-btn, .modal-btns .secondary-btn{margin-top:0;}

  .confirm-text{color:var(--text-muted); font-size:14px; line-height:1.5; margin-bottom:18px;}

  .player-name{cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
  .player-name small{color:var(--text-muted);font-weight:500;font-size:12px;}
  textarea.modal-input{resize:none;line-height:1.5;}
  .install-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-size:13.5px;font-weight:600;}
  .install-banner button{background:var(--gold);color:#1A1408;border:none;border-radius:20px;padding:8px 14px;font-weight:700;cursor:pointer;}
  .date-row .icon-btn{font-size:22px;padding:2px 12px;color:var(--gold);}
  .row-btns{display:flex;gap:8px;margin-bottom:6px;}
  .row-btns .secondary-btn{margin-top:0;font-size:13px;}
  .tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;margin-bottom:14px;}
  .tabs button{flex:1;background:none;border:none;color:var(--text-muted);font-weight:700;font-size:13.5px;padding:10px;border-radius:8px;cursor:pointer;}
  .tabs button.on{background:var(--gold);color:#1A1408;}
  .rep-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:8px;}
  .rep-top{display:flex;justify-content:space-between;font-weight:600;font-size:15px;margin-bottom:8px;}
  .bar{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-bottom:7px;}
  .bar i{display:block;height:100%;border-radius:4px;}
  .rep-row .cat-meta{margin:0;}
  
  :root{--late:#E8934A; color-scheme:dark;}
  [data-theme="light"]{--bg:#F2F5F1;--surface:#FFFFFF;--surface-2:#E8EEE8;--border:#D3DDD4;--text:#15221A;--text-muted:#5B6F61;--gold:#9A6B12;--gold-soft:rgba(154,107,18,.13);--present:#2A8A50;--absent:#C4453A;--late:#C9711F;color-scheme:light;}
  [data-theme="light"] .top-header{background:linear-gradient(180deg,#E3ECE3,var(--bg));}
  [data-theme="light"] .bottom-nav{background:rgba(255,255,255,.93);}
  [data-theme="light"] .sticky-bottom{background:linear-gradient(0deg,var(--bg) 60%,rgba(242,245,241,0));}
  [data-theme="light"] .date-row input[type="date"]::-webkit-calendar-picker-indicator{filter:none;}
  [data-theme="light"] .primary-btn,[data-theme="light"] .mark-all-btn,[data-theme="light"] .tabs button.on,[data-theme="light"] .chip.on,[data-theme="light"] .install-banner button,[data-theme="light"] .copied-toast{color:#fff;}
  .status-btn.late.active{background:rgba(232,147,74,.16);border-color:var(--late);color:var(--late);}
  .player-row.is-late{border-color:rgba(232,147,74,.45);}
  .status-btn.note{flex:0 0 46px;padding:12px 0;}
  .note-line{font-size:12.5px;color:var(--text-muted);font-style:italic;margin:-4px 0 10px;cursor:pointer;}
  .chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .chip{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);border-radius:20px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#1A1408;}
  a, button{font-family:inherit;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const STORAGE_KEY = 'bfc-data';
let state = { categories: [], players: {}, sessions: {} };
let view = { screen: 'loading' };
let loaded = false;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function formatDateLong(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}
function formatDateSlash(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function esc(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function loadData(){
  try {
    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {
      const parsed = JSON.parse(saved);

      state = {
        categories: Array.isArray(parsed.categories) ? parsed.categories : [],
        players: parsed.players || {},
        sessions: parsed.sessions || {}
      };
    }
  } catch(e) {
    console.error('Load failed:', e);
  }

  loaded = true;
  view = { screen: 'home' };

  // Create the first history entry so the Android back button has
  // somewhere to land on instead of immediately closing the app.
  try {
    history.replaceState(
      { screen: 'home' },
      '',
      location.href
    );
  } catch(e) {
    // Safari blocks history.replaceState() on file:// pages (SecurityError).
    // Safe to ignore - it only affects Android-style back-button navigation.
    console.warn('replaceState skipped:', e);
  }

  render();
}

function saveData(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    console.log('BFC data saved');
  } catch(e) {
    console.error('Save failed:', e);
  }
}
// ---------- helpers ----------
function playersOf(catId){ return state.players[catId] || []; }
function sessionsOf(catId){ return (state.sessions[catId] || []).slice().sort((a,b)=> b.date.localeCompare(a.date)); }
function findSession(catId, date){ return (state.sessions[catId]||[]).find(s=>s.date===date); }

function pitchMarkSVG(){
  return `<svg class="pitch-mark" width="220" height="220" viewBox="0 0 220 220" fill="none">
    <circle cx="150" cy="60" r="90" stroke="#D4A64A" stroke-width="2"/>
    <circle cx="150" cy="60" r="3" fill="#D4A64A"/>
    <line x1="0" y1="60" x2="220" y2="60" stroke="#D4A64A" stroke-width="2"/>
  </svg>`;
}

// ---------- render router ----------
// preserveScroll: when true, keeps the current scroll position after re-render
// instead of jumping back to the top. Used for in-place updates (marking a
// player present/absent, toggling settings) where the user shouldn't lose
// their place in the list.
function render(preserveScroll){
  const scrollY = preserveScroll ? window.scrollY : 0;
  const app = document.getElementById('app');
  if (!loaded){
    app.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--text-muted);font-family:'Oswald',sans-serif;letter-spacing:2px;">LOADING BFC…</div>`;
    return;
  }
  if (view.catId && !state.categories.find(c=>c.id===view.catId)) view = { screen:'home' };
  let html = '';
  switch(view.screen){
    case 'home': html = renderHome(); break;
    case 'attendance': html = renderAttendance(); break;
    case 'generate': html = renderGenerate(); break;
    case 'history': html = renderHistoryList(); break;
    case 'historyDetail': html = renderHistoryDetail(); break;
    case 'manage': html = renderManageCategories(); break;
    case 'report': html = renderReport(); break;
    case 'managePlayers': html = renderManagePlayers(); break;
    default: html = renderHome();
  }
  app.innerHTML = html + (view.modal ? view.modal : '');
  if (preserveScroll){
    window.scrollTo(0, scrollY);
  } else {
    window.scrollTo(0,0);
  }
}

// setView now pushes a browser-history entry for every screen change (unless
// addHistory is explicitly false), so the Android/Xiaomi system Back button
// steps backward through the app's screens instead of closing it outright.
function setView(v, addHistory = true){
  view = Object.assign({}, v);

  if (addHistory) {
    try {
      history.pushState(
        { screen: view.screen, catId: view.catId || null },
        '',
        location.href
      );
    } catch(e) {
      // Safari blocks history.pushState() on file:// pages (SecurityError).
      // Safe to ignore - it only affects Android-style back-button navigation.
      console.warn('pushState skipped:', e);
    }
  }

  render();
}

// ---------- ANDROID / BROWSER BACK BUTTON ----------
window.addEventListener('popstate', function(event) {

  // If a modal is open, the system Back button closes the modal first
  // instead of navigating to the previous screen.
  if (view.modal) {
    view.modal = null;
    render();
    return;
  }

  const previous = event.state;

  if (previous && previous.screen) {
    view = {
      screen: previous.screen==='historyDetail' ? 'history' : previous.screen==='generate' ? 'home' : previous.screen,
      ...(previous.catId ? { catId: previous.catId } : {})
    };

    // Restore attendance state when going back to the attendance screen
    if (previous.screen === 'attendance' && previous.catId) {
      const date = todayISO();
      const existing = findSession(previous.catId, date);
      const statusMap = {};

      if (existing) {
        existing.present.forEach(id => statusMap[id] = 'present');
        existing.absent.forEach(id => statusMap[id] = 'absent');
    (existing.late||[]).forEach(id => statusMap[id] = 'late');
      }

      view.date = date;
      view.statusMap = statusMap;
      view.stype = (existing&&existing.type)||'Training';
      view.notes = Object.assign({},(existing&&existing.notes)||{});
    }

    render();
  }
});

    existing.present.forEach(id => statusMap[id] = 'present');
    existing.absent.forEach(id => statusMap[id] = 'absent');
    (existing.late||[]).forEach(id => statusMap[id] = 'late');
  }
  setView({ screen:'attendance', catId, date, statusMap, stype:(existing&&existing.type)||'Training', notes:Object.assign({},(existing&&existing.notes)||{}) });

function changeDate(newDate){
  view.date = newDate;
  const existing = findSession(view.catId, newDate);
  const statusMap = {};
  if (existing){
    existing.present.forEach(id => statusMap[id]='present');
    existing.absent.forEach(id => statusMap[id]='absent');
    (existing.late||[]).forEach(id => statusMap[id]='late');
  }
  view.statusMap = statusMap;
  view.stype = (existing&&existing.type)||'Training';
  view.notes = Object.assign({},(existing&&existing.notes)||{});
  render();
}
function setStatus(playerId, status){
  vib();
  view.statusMap[playerId] = (view.statusMap[playerId] === status) ? undefined : status;
  if (view.statusMap[playerId] === undefined) delete view.statusMap[playerId];
  persistDraftSession();
  render(true);
}
function markAllPresent(){
  const players = playersOf(view.catId);
  players.forEach(p => view.statusMap[p.id] = 'present');
  persistDraftSession();
  render(true);
}
function toggleIncludeAbsent(){
  const cat = state.categories.find(c=>c.id===view.catId);
  cat.includeAbsent = !cat.includeAbsent;
  saveData();
  render(true);
}
function persistDraftSession(){
  const players = playersOf(view.catId);
  const present = players.filter(p=>['present','late'].includes(view.statusMap[p.id])).map(p=>p.id);
  const late = players.filter(p=>view.statusMap[p.id]==='late').map(p=>p.id);
  const absent = players.filter(p=>view.statusMap[p.id]==='absent').map(p=>p.id);
  if (present.length===0 && absent.length===0) return;
  let list = state.sessions[view.catId] || (state.sessions[view.catId] = []);
  let existing = list.find(s=>s.date===view.date);
  if (existing){
    existing.present = present;
    existing.absent = absent; existing.late = late; existing.type = view.stype||'Training'; existing.notes = view.notes||{};
    existing.timestamp = Date.now();
  } else {
    list.push({ id: uid(), date: view.date, present, absent, late, type: view.stype||'Training', notes: view.notes||{}, timestamp: Date.now() });
  }
  saveData();
}

// ---------- GENERATE ----------
function generateAttendance(){
  persistDraftSession();
  const cat = state.categories.find(c=>c.id===view.catId);
  const players = playersOf(view.catId);
  const presentPlayers = players.filter(p=>['present','late'].includes(view.statusMap[p.id]));
  const absentPlayers = players.filter(p=>view.statusMap[p.id]==='absent');
  const lines = [
    `BFC ${cat.name} — ${view.stype||'Training'} Attendance`,
    `📅 ${formatDateSlash(view.date)}`,
    ``,
    `Present (${presentPlayers.length}):`,
    ...presentPlayers.map(p=>p.name + (view.statusMap[p.id]==='late'?' (late)':''))
  ];
  if (cat.includeAbsent){
    lines.push(``, `Absent (${absentPlayers.length}):`, ...absentPlayers.map(p=>p.name));
  }
  const noted = players.filter(p=>view.notes&&view.notes[p.id]);
  if (noted.length) lines.push(``, `Notes:`, ...noted.map(p=>`${p.name}: ${view.notes[p.id]}`));
  const text = lines.join('\n');
  setView({ screen:'generate', catId: view.catId, date: view.date, text });
}
function renderGenerate(){
  const cat = state.categories.find(c=>c.id===view.catId);
  return `

    <button class="primary-btn" onclick="copyText()">📋 Copy Text</button>
    <button class="secondary-btn" onclick="window.open('https://wa.me/?text='+encodeURIComponent(view.text))">💬 Send to WhatsApp</button>
    <button class="secondary-btn" onclick="shareText()">📤 Share…</button>
    <button class="secondary-btn" onclick="navTo('home')">Done</button>
  </div>
  `;
}
function copyText(){
  const text = view.text;
  const done = () => {
    const toast = document.createElement('div');
    toast.className = 'copied-toast';
    toast.textContent = 'Copied ✓';
    document.getElementById('app').appendChild(toast);
    setTimeout(()=>toast.remove(), 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  document.body.removeChild(ta);
}
function shareText(){
  if (navigator.share){
    navigator.share({ text: view.text }).catch(()=>{});
  } else {
    copyText();
  }
}

// ---------- HISTORY ----------
function renderHistoryList(){
  const cats = state.categories;
  let body = '';
  if (cats.length === 0){
    body = `<div class="empty-state"><div class="icon">📅</div><h3>No history yet</h3><p>Sessions you record will show up here.</p></div>`;
  } else {
    body = cats.map(cat => {
      const sessions = sessionsOf(cat.id);
      if (sessions.length === 0) return '';
      const rows = sessions.map(s => {
        const total = playersOf(cat.id).length || (s.present.length + s.absent.length);
        const ratio = total ? s.present.length/total : 0;
        const badgeClass = ratio >= 0.9 ? 'badge-full' : ratio >= 0.6 ? 'badge-partial' : 'badge-low';
        return `<div class="session-row" onclick="openHistoryDetail('${cat.id}','${s.id}')">
          <div class="session-date">${formatDateLong(s.date)}${s.type&&s.type!=='Training'?` <span style="color:var(--gold);font-size:12px">· ${esc(s.type)}</span>`:''}</div>
          <div class="session-badge ${badgeClass}">${s.present.length} / ${total}</div>
        </div>`;
      }).join('');
      return `<div class="history-group-title" style="display:flex;justify-content:space-between"><span>${esc(cat.name)}</span><span style="color:var(--gold);cursor:pointer" onclick="openReport('${cat.id}')">📊 Report</span></div>${rows}`;
    }).join('');
    if (!body.trim()){
      body = `<div class="empty-state"><div class="icon">📅</div><h3>No sessions yet</h3><p>Take attendance for a team and it will appear here.</p></div>`;
    }
  }
  return `
  <div class="top-header">
    <div class="brand-row"><div><div class="brand" style="font-size:24px;">History</div></div></div>
  </div>
  <div class="content">${body}</div>
  ${renderBottomNav('history')}
  `;
}
function openHistoryDetail(catId, sessionId){
  const session = (state.sessions[catId]||[]).find(s=>s.id===sessionId);
  setView({ screen:'historyDetail', catId, sessionId, session });
}
function renderHistoryDetail(){
  const cat = state.categories.find(c=>c.id===view.catId);
  const session = view.session;
  const players = playersOf(view.catId);
  const nameOf = id => { const p = players.find(pp=>pp.id===id); return p ? p.name : '(removed player)'; };
  const tag = id => ((session.late||[]).includes(id)?' ⏰ late':'') + (session.notes&&session.notes[id]?' — '+session.notes[id]:'');
  const presentNames = session.present.map(id=>nameOf(id)+tag(id));
  const absentNames = session.absent.map(id=>nameOf(id)+tag(id));
  const total = presentNames.length + absentNames.length;
  return `
  <div class="top-header">
    <div class="brand-row">
      <button class="back-btn" onclick="setView({screen:'history'})">‹</button>
      <div></div>
    </div>
    <div class="header-title" style="margin-top:10px;">
      <div class="screen-title">${esc(cat.name)}</div>
      <div class="screen-sub">${esc(session.type||'Training')} · ${formatDateLong(session.date)} · ${presentNames.length}/${total} present</div>
    </div>
  </div>
  <div class="content no-nav">
    <div class="row-btns"><button class="secondary-btn" onclick="editSession()">✎ Edit</button><button class="secondary-btn" style="color:var(--absent)" onclick="deleteSession()">🗑 Delete</button></div>
    <div class="detail-list-title" style="color:var(--present);">✓ Present (${presentNames.length})</div>
    ${presentNames.length ? presentNames.map(n=>`<div class="detail-player">🟢 ${esc(n)}</div>`).join('') : `<div class="confirm-text">None recorded.</div>`}
    <div class="detail-list-title" style="color:var(--absent);">✕ Absent (${absentNames.length})</div>
    ${absentNames.length ? absentNames.map(n=>`<div class="detail-player">🔴 ${esc(n)}</div>`).join('') : `<div class="confirm-text">None recorded.</div>`}
  </div>
  `;
}

// ---------- REPORTS & STREAKS ----------
function openReport(catId){ setView({screen:'report', catId, month:todayISO().slice(0,7), tab:'month'}); }
function shiftMonth(n){
  const [y,m]=view.month.split('-').map(Number);
  const d=new Date(y,m-1+n,1);
  view.month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); render(true);
}
function playerStats(catId,pid,month,rtype){
  const l=(state.sessions[catId]||[]).filter(s=>(s.present.includes(pid)||s.absent.includes(pid))&&(!rtype||rtype==='All'||(s.type||'Training')===rtype)).sort((a,b)=>a.date.localeCompare(b.date));
  const inM=l.filter(s=>s.date.startsWith(month));
  const isP=s=>s.present.includes(pid);
  let run=0,best=0; l.forEach(s=>{ if(isP(s)){run++; best=Math.max(best,run);} else run=0; });
  let miss=0; for(let i=l.length-1;i>=0&&!isP(l[i]);i--) miss++;
  return {mt:inM.length, mp:inM.filter(isP).length, at:l.length, ap:l.filter(isP).length, cur:run, best, miss};
}
function capName(n){ return String(n).trim().replace(/\S+/g,w=>w.charAt(0).toUpperCase()+w.slice(1)); }
function buildReportText(cat,label,rtype,sess,list,avg){
  const pc=r=>r.st.mt?Math.round(r.st.mp/r.st.mt*100):0;
  const bar=(v,sq)=>{ const n=Math.round(v/20); return sq.repeat(n)+'⬜'.repeat(5-n); };
  const line=(r,sq)=>`${bar(pc(r),sq)} ${capName(r.p.name)} · ${pc(r)}% (${r.st.mp} of ${r.st.mt})`;
  const g=(a,b)=>list.filter(r=>pc(r)>=a&&pc(r)<=b);
  const groups=[['🟢','Excellent (80% and above)',g(80,100),'🟩'],['🟡','Good (50–79%)',g(50,79),'🟨'],['🔴','Needs attention (below 50%)',g(0,49),'🟥']];
  const face=avg>=80?'🟢':avg>=50?'🟡':'🔴';
  const out=[`⚽ *BFC ${cat.name} — Attendance Report*`,`📅 ${label}${rtype!=='All'?' · '+rtype+' sessions':''}`,'',`📊 *Summary*`,`• Sessions held: ${sess.length}`,`• Team average: ${avg}% ${face}`,`• Players: ${list.length}`];
  groups.forEach(([ic,title,arr,sq])=>{ if(!arr.length) return;
    out.push('','━━━━━━━━━━━━━━',`${ic} *${title}* — ${arr.length} player${arr.length>1?'s':''}`,...arr.map(r=>line(r,sq))); });
  return out.join('\n');
}
function renderReport(){
  const cat=state.categories.find(c=>c.id===view.catId);
  const month=view.month||todayISO().slice(0,7), tab=view.tab||'month';
  const [y,m]=month.split('-').map(Number);
  const label=new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const rtype=view.rtype||'All';
  const sess=sessionsOf(view.catId).filter(x=>x.date.startsWith(month)&&(rtype==='All'||(x.type||'Training')===rtype));
  const tot=sess.reduce((a,x)=>a+x.present.length+x.absent.length,0);
  const pres=sess.reduce((a,x)=>a+x.present.length,0);
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const col=v=>v>=80?'var(--present)':v>=50?'var(--gold)':'var(--absent)';
  const rows=playersOf(view.catId).map(p=>({p,st:playerStats(view.catId,p.id,month,rtype)}));
  const row=(name,v,right,meta)=>`<div class="rep-row"><div class="rep-top"><span>${esc(name)}</span><b style="color:${col(v)}">${right}</b></div><div class="bar"><i style="width:${v}%;background:${col(v)}"></i></div><div class="cat-meta">${meta}</div></div>`;
  let body='', text='';
  if(tab==='month'){
    const list=rows.filter(r=>r.st.mt>0).sort((a,b)=>pct(b.st.mp,b.st.mt)-pct(a.st.mp,a.st.mt)||a.p.name.localeCompare(b.p.name));
    view.text=buildReportText(cat,label,rtype,sess,list,pct(pres,tot));
    body = list.length ? `<div class="scoreboard"><div><div class="score-main">${pct(pres,tot)}%</div><div class="score-label">Average attendance</div></div><div class="score-absent" style="color:var(--gold)">${sess.length}<small>Sessions</small></div></div>`
      + list.map(r=>{const v=pct(r.st.mp,r.st.mt); return row(r.p.name,v,v+'%',`${r.st.mp} of ${r.st.mt} sessions`);}).join('')
      + `<button class="primary-btn" style="margin-top:8px" onclick="copyText()">📋 Copy report</button><button class="secondary-btn" onclick="window.open('https://wa.me/?text='+encodeURIComponent(view.text))">💬 Send to WhatsApp</button>`
      : `<div class="empty-state"><div class="icon">📊</div><h3>No sessions in ${label}</h3><p>Take attendance and this month's report will fill in.</p></div>`;
  } else {
    const list=rows.filter(r=>r.st.at>0).sort((a,b)=>b.st.cur-a.st.cur||b.st.ap/b.st.at-a.st.ap/a.st.at);
    body = list.length ? list.map(r=>{const v=pct(r.st.ap,r.st.at); const warn=r.st.miss>=2?` · <span style="color:var(--absent);font-weight:600">Missed last ${r.st.miss}</span>`:''; return row(r.p.name,v,r.st.cur?`🔥 ${r.st.cur}`:'–',`Best streak ${r.st.best} · ${v}% overall${warn}`);}).join('')
      : `<div class="empty-state"><div class="icon">🔥</div><h3>No streaks yet</h3><p>Streaks appear after a few sessions are recorded.</p></div>`;
  }
  return `
  <div class="top-header">
    <div class="brand-row"><button class="back-btn" onclick="history.back()">‹</button><div></div></div>
    <div class="header-title" style="margin-top:10px;"><div class="screen-title">${esc(cat.name)}</div><div class="screen-sub">${tab==='month'?'Monthly report':'Attendance streaks (all time)'}</div></div>
  </div>
  <div class="content no-nav">
    <div class="tabs"><button class="${tab==='month'?'on':''}" onclick="view.tab='month';render(true)">Month</button><button class="${tab==='streaks'?'on':''}" onclick="view.tab='streaks';render(true)">🔥 Streaks</button></div>
    <div class="chips">${['All',...TYPES].map(t=>`<button class="chip ${rtype===t?'on':''}" onclick="view.rtype='${t}';render(true)">${t}</button>`).join('')}</div>
    ${tab==='month'?`<div class="date-row"><button class="icon-btn" onclick="shiftMonth(-1)">‹</button><div style="flex:1;text-align:center;font-weight:600">${label}</div><button class="icon-btn" onclick="shiftMonth(1)">›</button></div>`:''}
    ${body}
  </div>`;
}

const TYPES=['Training','Match','Friendly'];
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    <div class="modal-sheet"><div class="modal-title">Training days</div>
      <div class="chips" id="dayChips">${[1,2,3,4,5,6,0].map(d=>`<button class="chip ${c.days&&c.days.includes(d)?'on':''}" data-d="${d}" onclick="this.classList.toggle('on')">${DAYS[d]}</button>`).join('')}</div>
      <input id="timeInput" type="time" class="modal-input" value="${c.time||'17:00'}">
      <div class="confirm-text">Home shows a reminder on these days. Calendar alerts ring on your iPhone 1 hour and 15 minutes before.</div>

function saveSchedule(catId,cal){
  const c=state.categories.find(x=>x.id===catId);
  const days=[...document.querySelectorAll('#dayChips .chip.on')].map(b=>+b.dataset.d);
  if(cal && !days.length){ toast('Pick at least one day'); return; }
  c.days=days;
  c.time=document.getElementById('timeInput').value||'17:00';
  saveData();
  if(cal) addToCalendar(c);
  view.modal=null; render(true);
  if(!cal) toast('Reminder saved ✓');
}
function icsDate(d,t){ return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'T'+t.replace(':','')+'00'; }
function addToCalendar(c){
  const t=c.time||'17:00', [hh,mm]=t.split(':').map(Number), tot=hh*60+mm+90;
  const endT=String(Math.floor(tot/60)%24).padStart(2,'0')+':'+String(tot%60).padStart(2,'0');
  const codes=['SU','MO','TU','WE','TH','FR','SA'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const alarm=(m,txt)=>['BEGIN:VALARM','TRIGGER:-PT'+m+'M','ACTION:DISPLAY','DESCRIPTION:'+txt,'END:VALARM'];
  const ev=(c.days||[]).map(d=>{
    const n=new Date(); n.setDate(n.getDate()+((d-n.getDay()+7)%7));
    return ['BEGIN:VEVENT','UID:bfc-'+c.id+'-'+d+'@bfc-attendance','DTSTAMP:'+stamp,
      'DTSTART:'+icsDate(n,t),'DTEND:'+icsDate(n,endT),'RRULE:FREQ=WEEKLY;BYDAY='+codes[d],
      'SUMMARY:⚽ BFC '+c.name+' training','DESCRIPTION:Training session for '+c.name+' at '+t,
      ...alarm(60,'BFC '+c.name+' training in 1 hour'),...alarm(15,'BFC '+c.name+' training in 15 minutes'),'END:VEVENT'].join('\r\n');
  });
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//BFC Attendance//EN','CALSCALE:GREGORIAN',...ev,'END:VCALENDAR'].join('\r\n');
  const file=new File([ics],'bfc-'+c.name.replace(/\W+/g,'-')+'-training.ics',{type:'text/calendar'});
  if(navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file]}).catch(()=>{}); return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=file.name;
  document.body.appendChild(a); a.click(); a.remove();
}
function reminderBanners(){
  const now=new Date(), dow=now.getDay(), today=todayISO();
  const hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  return state.categories.filter(c=>c.days&&c.days.includes(dow)&&!findSession(c.id,today)&&playersOf(c.id).length).map(c=>{
    const t=c.time||'17:00';
    return `<div class="install-banner" style="cursor:pointer" onclick="openCategory('${c.id}')"><span>🔔 ${esc(c.name)} ${hm>=t?'— attendance not taken yet':'trains today at '+t}</span><button>Take</button></div>`;
  }).join('');
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && view.screen==='home' && !view.modal) render(true); });

// ---------- extras ----------
function vib(){ try{ navigator.vibrate && navigator.vibrate(12); }catch(e){} }
function toast(msg,ms){
  const t=document.createElement('div'); t.className='copied-toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),ms||1600);
}
function cycleStatus(id){
  const s=view.statusMap[id];
  if(!s) view.statusMap[id]='present'; else if(s==='present') view.statusMap[id]='late'; else if(s==='late') view.statusMap[id]='absent'; else delete view.statusMap[id];

}
function askConfirm(title,text,label,fn){
  view.confirmFn=fn;
  view.modal=`<div class="modal-overlay" onclick="if(event.target===this) closeNote()">
    <div class="modal-sheet"><div class="modal-title">${esc(title)}</div><div class="confirm-text">${esc(text)}</div>

    <button class="primary-btn" style="flex:1;background:var(--absent);box-shadow:none;color:#fff" onclick="runConfirm()">${esc(label)}</button></div></div></div>`;
  render(true);
}
function runConfirm(){ const f=view.confirmFn; view.modal=null; view.confirmFn=null; if(f) f(); }
function clearAll(){ askConfirm('Clear this date?','All marks and notes for '+formatDateLong(view.date)+' will be removed.','Clear',doClear); }
function doClear(){
  view.statusMap={}; view.notes={};
  state.sessions[view.catId]=(state.sessions[view.catId]||[]).filter(x=>x.date!==view.date);
  saveData(); render(true); toast('Cleared');
}
function shiftDate(n){
  const [y,m,d]=view.date.split('-').map(Number);
  const dt=new Date(y,m-1,d+n);
  changeDate(dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'));
}
function rateOf(catId,pid){
  let t=0,p=0;
  (state.sessions[catId]||[]).forEach(s=>{ if(s.present.includes(pid)){t++;p++;} else if(s.absent.includes(pid)) t++; });
  return t ? Math.round(p/t*100)+'% attended' : '';
}
function editSession(){
  const d=view.session.date, c=view.catId;
  setView({screen:'attendance',catId:c,date:d,statusMap:{}}); changeDate(d);
}
function deleteSession(){ askConfirm('Delete this session?','It will be removed from history.','Delete',doDeleteSession); }
function doDeleteSession(){
  state.sessions[view.catId]=state.sessions[view.catId].filter(s=>s.id!==view.sessionId);
  saveData(); setView({screen:'history'}); toast('Session deleted');
}
function exportData(){
  const json=JSON.stringify(state,null,1), name='bfc-backup-'+todayISO();
  const files=[new File([json],name+'.json',{type:'application/json'}), new File([json],name+'.txt',{type:'text/plain'})];
  const f=(navigator.canShare && navigator.share) ? files.find(x=>{ try{ return navigator.canShare({files:[x]}); }catch(e){ return false; } }) : null;
  const download=()=>{
    const a=document.createElement('a'); a.href=URL.createObjectURL(files[0]); a.download=name+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    toast('Backup saved to Downloads. If nothing appears, use “Copy backup text”.',3500);
  };
  if(f){ navigator.share({files:[f],title:'BFC backup'}).then(()=>toast('Backup shared ✓')).catch(e=>{ if(!e||e.name!=='AbortError') download(); }); }
  else download();
}
function restoreFromText(txt){
  let d; try{
    d=JSON.parse(String(txt).trim());
    if(!d || !Array.isArray(d.categories) || !d.categories.every(c=>c && c.id && typeof c.name==='string')) throw 0;
  }catch(e){ toast('That is not a BFC backup',2500); return; }
  const pl=d.players||{}, se=d.sessions||{};
  d.categories.forEach(c=>{ if(!Array.isArray(pl[c.id])) pl[c.id]=[]; if(!Array.isArray(se[c.id])) se[c.id]=[]; });
  const nT=d.categories.length, nP=d.categories.reduce((a,c)=>a+pl[c.id].length,0), nS=d.categories.reduce((a,c)=>a+se[c.id].length,0);
  askConfirm('Restore this backup?',`It contains ${nT} team${nT!==1?'s':''}, ${nP} player${nP!==1?'s':''} and ${nS} session${nS!==1?'s':''}. This replaces everything currently in the app.`,'Restore',()=>{
    try{ localStorage.setItem('bfc-data-before-restore', JSON.stringify(state)); }catch(e){}
    state={categories:d.categories,players:pl,sessions:se};
    saveData(); view={screen:'manage'}; render(); toast('Backup restored ✓');
  });
}
function importData(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ inp.value=''; restoreFromText(rd.result); };
  rd.onerror=()=>toast('Could not read that file');
  rd.readAsText(f);
}
function copyBackup(){
  const t=JSON.stringify(state), done=()=>toast('Backup copied ✓');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));
  else fallbackCopy(t,done);
}
function openPasteRestore(){
  view.modal=`<div class="modal-overlay" onclick="if(event.target===this) closeNote()">
    <div class="modal-sheet"><div class="modal-title">Paste backup</div>
    <textarea id="restoreText" class="modal-input" rows="5" placeholder="Paste the copied backup text here"></textarea>
    <div class="modal-btns"><button class="secondary-btn" style="flex:1" onclick="closeNote()">Cancel</button>
    <button class="primary-btn" style="flex:1" onclick="restoreFromText(document.getElementById('restoreText').value)">Restore</button></div></div></div>`;
  render(true);
}
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstall=e; if(view.screen==='home') render(true); });
window.addEventListener('appinstalled',()=>{ deferredInstall=null; });
function installBanner(){
  if(deferredInstall) return `<div class="install-banner"><span>Install BFC on your phone</span><button onclick="doInstall()">Install</button></div>`;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone=navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  let hidden=false; try{ hidden=localStorage.getItem('bfc-ios-hint')==='1'; }catch(e){}
  if(ios && !standalone && !hidden) return `<div class="install-banner"><span>📲 Install: tap Share ⬆︎ then “Add to Home Screen”</span><button onclick="hideIosHint()">Got it</button></div>`;
  return '';
}
function hideIosHint(){ try{ localStorage.setItem('bfc-ios-hint','1'); }catch(e){} render(true); }
function doInstall(){ if(!deferredInstall) return; deferredInstall.prompt(); deferredInstall.userChoice.finally(()=>{ deferredInstall=null; render(true); }); }
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

// ---------- init ----------
loadData();
</script>
</body>
</html>
